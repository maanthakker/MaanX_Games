# Render blueprint: one web service running server.js (store + both games).
# MONGODB_URI is asked for on first deploy; paste a MongoDB Atlas connection string.
services:
  - type: web
    name: maanx-games
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
